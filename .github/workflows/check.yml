name: Linux Node 20 checks
on:
  pull_request:
  push:
    branches: [main, feat/grok-risk-assessment]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-node20:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Filesystem metadata capabilities
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends attr acl
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run build:compile
      - name: Portable and compiled workflows; isolated runner restore
        run: |
          export SKILLTREE_DEMO_NODE="$(command -v node)"
          bun run demo
          SKILLTREE_DEMO_ENTRY=bin/skilltree.mjs bun run demo
          bun run demo:restore
      - name: Local package launch
        run: |
          export npm_config_cache="$RUNNER_TEMP/skilltree-npm"
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/skilltree-pack.json"
          skilltree_package="$(node -e 'const fs=require("fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1]))[0].filename)' "$RUNNER_TEMP/skilltree-pack.json")"
          npx --yes --package="$PWD/$skilltree_package" skilltree --help
