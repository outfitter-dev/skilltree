name: Release
on:
  push:
    branches: [main]
  pull_request:
    paths: [.github/workflows/**]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed current version through the manual release environment
        required: false
        default: false
        type: boolean
concurrency:
  group: skilltree-release-main
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test tests/release.test.ts
  version:
    needs: contracts
    if: github.repository == 'outfitter-dev/skilltree' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      pending: ${{ steps.pending.outputs.pending }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: pending
        run: |
          bun run changeset status --output "$RUNNER_TEMP/changesets.json"
          bun -e 'const fs=require("node:fs");const s=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));fs.appendFileSync(process.env.GITHUB_OUTPUT,"pending="+(s.releases.length>0)+"\n");' "$RUNNER_TEMP/changesets.json"
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        if: steps.pending.outputs.pending == 'true'
        with:
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          version: bun run version:packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Preserve or infer conservative release labels
        if: steps.pending.outputs.pending == 'true'
        run: |
          git switch --detach "$GITHUB_SHA"
          bun scripts/release.ts labels
        env:
          GH_TOKEN: ${{ github.token }}
  policy:
    needs: version
    if: github.repository == 'outfitter-dev/skilltree' && github.ref == 'refs/heads/main' && needs.version.outputs.pending == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
      pull-requests: read
      actions: read
    outputs:
      ready: ${{ steps.policy.outputs.ready }}
      environment: ${{ steps.policy.outputs.environment }}
      source_commit: ${{ steps.policy.outputs.source_commit }}
      version: ${{ steps.policy.outputs.version }}
      tag: ${{ steps.policy.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: policy
        run: bun run release:policy
        env:
          GH_TOKEN: ${{ github.token }}
          SKILLTREE_MANUAL_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
  publish:
    needs: policy
    if: github.repository == 'outfitter-dev/skilltree' && github.ref == 'refs/heads/main' && needs.policy.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ needs.policy.outputs.environment }}
    permissions:
      contents: read
      checks: read
      pull-requests: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SKILLTREE_RELEASE_COMMIT: ${{ needs.policy.outputs.source_commit }}
      SKILLTREE_RELEASE_ENVIRONMENT: ${{ needs.policy.outputs.environment }}
      SKILLTREE_MANUAL_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.policy.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: npm install --global npm@11.18.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Stage and inspect one portable package
        run: bun run release:stage -- --dir "$RUNNER_TEMP/skilltree-release"
      - name: Cold-install staged bytes before mutation
        run: bun run release:smoke -- "$RUNNER_TEMP/skilltree-release"
      - name: Recheck policy, publish with OIDC and verify immutable registry bytes
        run: bun run release:publish -- --dir "$RUNNER_TEMP/skilltree-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skilltree-release
          path: ${{ runner.temp }}/skilltree-release/*
          if-no-files-found: error
  registry-smoke:
    needs: [policy, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.policy.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Cold registry-based execution on the consumer runtime floor
        env:
          RELEASE_VERSION: ${{ needs.policy.outputs.version }}
        run: bun run release:smoke -- "$RELEASE_VERSION"
  github-release:
    needs: [policy, publish, registry-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.policy.outputs.version }}
      RELEASE_TAG: ${{ needs.policy.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.policy.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: skilltree-release
          path: release-assets
      - name: Create the matching immutable release tag and GitHub release
        run: |
          tag="v$RELEASE_VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -n 1 "$tag")" = "$RELEASE_COMMIT"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$RELEASE_COMMIT"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false
            gh release view "$tag" --json assets > "$RUNNER_TEMP/existing-assets.json"
            node -e 'const fs=require("node:fs");const expected=fs.readdirSync("release-assets").sort();const actual=JSON.parse(fs.readFileSync(process.argv[1],"utf8")).assets.map(a=>a.name).sort();if(JSON.stringify(expected)!==JSON.stringify(actual))throw Error("Existing release asset names differ");' "$RUNNER_TEMP/existing-assets.json"
            mkdir "$RUNNER_TEMP/existing-release"
            gh release download "$tag" --dir "$RUNNER_TEMP/existing-release"
            for asset in release-assets/*; do
              cmp "$asset" "$RUNNER_TEMP/existing-release/$(basename "$asset")"
            done
            gh release view "$tag" --json url --jq .url
          elif [ "$RELEASE_TAG" = latest ]; then
            gh release create "$tag" --verify-tag --title "Skilltree $RELEASE_VERSION" --generate-notes release-assets/*
          else
            gh release create "$tag" --verify-tag --title "Skilltree $RELEASE_VERSION" --generate-notes --prerelease --latest=false release-assets/*
          fi
